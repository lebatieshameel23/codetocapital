name: Daily Shorts

on:
  schedule:
    - cron: "0 3 * * *"        # 03:00 UTC = 05:00 South Africa; schedules the next day's Shorts
  workflow_dispatch: {}         # lets you run it by hand from the Actions tab

permissions:
  contents: write               # commits history.json and snippets/ back to the repo

concurrency: shorts

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Generate, render and schedule
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # free
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}           # free backup (optional)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # free last resort (optional)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}    # paid, optional
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python run_daily.py
      - name: Publish product kits (download from the run page, then list in your store)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-kits
          path: out/kits/
          retention-days: 30
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content snippets
          git diff --cached --quiet || (git commit -m "Daily Shorts: update queue, history, snippets" && git pull --rebase && git push)
