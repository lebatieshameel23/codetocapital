name: Reply to CODE comments

on:
  schedule:
    - cron: "15 */3 * * *"      # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: shorts

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reply
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "YouTube not connected yet (no YT_REFRESH_TOKEN secret); skipping."; exit 0; fi
          python reply_bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Update replied comments" && git pull --rebase && git push)
